name: Prueba de carga
on:
  push:
    branches: [loadtest]
    paths: [".github/workflows/loadtest.yml", "loadtest/k6.js", "loadtest/run.txt"]
permissions:
  contents: write
jobs:
  carga:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      BASE: https://www.creadsia.com
    steps:
      - uses: actions/checkout@v4
      - name: k6
        run: |
          curl -sSL https://github.com/grafana/k6/releases/download/v0.54.0/k6-v0.54.0-linux-amd64.tar.gz | tar xz
          sudo mv k6-v0.54.0-linux-amd64/k6 /usr/local/bin/k6 && k6 version
      - name: Cuenta de prueba (una, sin saldo)
        run: |
          mkdir -p loadtest/results
          N=$(date +%s)
          curl -s -c jar.txt -o loadtest/results/signup.txt -w "%{http_code}\n" -H "content-type: application/json" \
            -d "{\"name\":\"Prueba de carga\",\"company\":\"Prueba de carga\",\"email\":\"hola+carga$N@creadsia.com\",\"password\":\"Carga-$N-Creads!x\"}" \
            "$BASE/api/auth/signup" | tee -a loadtest/results/signup.txt
          echo "COOKIE=creads_session=$(grep creads_session jar.txt | awk '{print $7}')" >> "$GITHUB_ENV"
      - name: Prueba (hasta 1.000 a la vez)
        run: |
          k6 run --quiet --summary-export loadtest/results/summary.json loadtest/k6.js 2>&1 | tail -80 > loadtest/results/k6.txt || true
          tail -60 loadtest/results/k6.txt
      - name: Save
        if: always()
        run: |
          git config user.name "creads-loadtest"; git config user.email "loadtest@creadsia.com"
          git add loadtest/results; git commit -m "Load test results [skip ci]" || true; git push || true
